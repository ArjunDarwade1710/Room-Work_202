services:
  - type: web
    name: homeflow
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: homeflow-db
          property: connectionString
      - key: PGSSL
        value: require
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
      - key: ARJUN_INITIAL_PASSWORD
        sync: false
      - key: AKSHAY_INITIAL_PASSWORD
        sync: false
      - key: VINIT_INITIAL_PASSWORD
        sync: false
      - key: DHRUV_INITIAL_PASSWORD
        sync: false
      - key: VAISHNAV_INITIAL_PASSWORD
        sync: false

databases:
  - name: homeflow-db
    databaseName: homeflow
    user: homeflow
    plan: free
